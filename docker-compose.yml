version: '3.8'

services:
  map-scraper-suite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmaps-scraper-suite
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SCRAPER_BINARY=/app/google_maps_scraper-1.18.1-linux-amd64
      - PORT=8080
    volumes:
      # Persistent results output and scraped datasets
      - ./gmaps-output:/app/gmaps-output
      # Persistent scraper cache and web runner data
      - ./webdata:/app/webdata
      - ./cache:/app/cache
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN
